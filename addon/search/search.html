<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI OmniSearch</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>AI OmniSearch</h1>
      <span id="version-info" class="version-info" title="Addon and Qdrant versions"></span>
    </div>
    <div class="header-right">
      <button id="toggle-management" class="icon-btn" title="Index Management">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 5.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 5.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        </svg>
      </button>
      <button id="open-settings" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
  <path d="M18.8 8.2 18.8 11.8 16.4 11.3 15.4 13.6 17.5 15 15 17.5 13.6 15.4 11.3 16.4 11.8 18.8 8.2 18.8 8.7 16.4 6.4 15.4 5 17.5 2.5 15 4.6 13.6 3.6 11.3 1.2 11.8 1.2 8.2 3.6 8.7 4.6 6.4 5 2.5 8.2 1.2 8.7 3.6 11.3 3.6 11.8 1.2 15 2.5 17.5 5 15.4 6.4 16.4 8.7Z"/>
  <circle cx="10" cy="10" r="3" fill="var(--bg, white)"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search by meaning or keywords..." autofocus>
      <select id="account-filter">
        <option value="">All accounts</option>
      </select>
      <button id="search-btn">Search</button>
    </div>

    <div class="filter-bar">
      <div class="mode-toggle" id="mode-toggle" title="How to match your search">
        <button data-mode="hybrid" class="mode-btn" title="Both engines, rank-fused">Hybrid</button>
        <button data-mode="semantic" class="mode-btn" title="Match by meaning (Ollama embeddings)">Semantic</button>
        <button data-mode="keyword" class="mode-btn" title="Match words and prefixes (BM25, works without Ollama)">Keyword</button>
      </div>
      <input type="text" id="from-filter" placeholder="from: sender contains" title="Sender contains">
      <select id="range-preset" title="Quick date range (fills the dates on the right) · Latest keeps every date and ranks the newest matches first">
        <option value="any">Any time</option>
        <option value="latest">Latest</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="60d">Last 60 days</option>
        <option value="week">This week</option>
        <option value="month">This month</option>
        <option value="lastmonth">Last month</option>
        <option value="year">This year</option>
        <option value="custom">Custom range</option>
      </select>
      <span class="date-range">
        <input type="date" id="after-filter" title="From this date">
        <span class="date-sep">&ndash;</span>
        <input type="date" id="before-filter" title="Up to this date">
      </span>
    </div>

    <div id="status" class="status"></div>

    <div id="results" class="results"></div>

    <!-- Management Panel (hidden by default) -->
    <div id="management-panel" class="management-panel hidden">
      <div class="management-header">
        <h2>Index Management</h2>
        <div class="health-indicators" id="health-indicators"></div>
      </div>

      <div class="management-stats" id="management-stats"></div>

      <div id="job-error" class="job-error hidden"></div>

      <div class="management-actions">
        <button id="rebuild-btn" class="btn-secondary"
          title="Walk every folder and index all mail. Already-indexed messages are skipped by content hash, so re-running after a failure resumes where it stopped.">
          Rebuild index</button>
        <button id="verify-btn" class="btn-secondary"
          title="Compare the index against every live message: deletes stale records, fixes folder drift, and re-ingests anything missing.">
          Verify and repair</button>
      </div>

      <div id="indexer-progress" class="indexer-progress hidden">
        <div class="progress-label" id="progress-label">Indexing...</div>
        <div class="progress-sub" id="progress-sub"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div id="account-cards" class="account-cards"></div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="../lib/http.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../lib/text.js"></script>
  <script src="../lib/qdrant.js"></script>
  <script src="../lib/ollama.js"></script>
  <script src="../lib/index.js"></script>
  <script src="../lib/search.js"></script>
  <script src="../ingest/dockey.js"></script>
  <script src="../ingest/open.js"></script>
  <script src="search.js"></script>
</body>
</html>
