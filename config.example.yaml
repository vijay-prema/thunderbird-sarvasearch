# Thunderbird AI OmniSearch Configuration
# Copy this file to config.yaml and edit to match your setup.
#
# There are no mail credentials here: the Thunderbird add-on reads mail that
# Thunderbird has already downloaded and pushes it to this server. No IMAP.

# ──────────────────────────────────────────────
# Ollama (embedding server) — bring your own
# ──────────────────────────────────────────────
# Must be running before the first full index. Pull the model with:
#   ollama pull nomic-embed-text
ollama:
  base_url: "http://localhost:11434"
  model: "nomic-embed-text"          # 768-dimensional embeddings

# ──────────────────────────────────────────────
# Qdrant (vector database) — bring your own
# ──────────────────────────────────────────────
qdrant:
  url: "http://localhost:6333"
  collection: "ai_omnisearch"        # created automatically on first start

# ──────────────────────────────────────────────
# API settings
# ──────────────────────────────────────────────
api:
  host: "127.0.0.1"                  # the add-on runs on the same machine
  port: 8342
  api_key: ""                        # if set, all requests require X-API-Key header
                                     # generate one with: openssl rand -hex 32

# ──────────────────────────────────────────────
# Database (keyword index, content hashes, folder lists)
# ──────────────────────────────────────────────
database:
  path: "data/ingest.db"             # put this on a volume if running in Docker

# ──────────────────────────────────────────────
# Ingestion
# ──────────────────────────────────────────────
ingest:
  max_batch: 250                     # max docs per /ingest request (HTTP 413 above)
  embed_batch: 64                    # docs per Ollama embed call

# ──────────────────────────────────────────────
# Search
# ──────────────────────────────────────────────
search:
  rrf_k: 60                          # Reciprocal Rank Fusion constant (standard: 60)
  candidates_multiplier: 3           # candidates per engine = limit × this
  keyword_weights: [8.0, 4.0, 2.0, 1.0]  # bm25 weights: subject, from, to, body

# Logging: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"
