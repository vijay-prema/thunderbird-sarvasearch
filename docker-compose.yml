# Thunderbird AI OmniSearch server.
#
# This compose file runs ONLY the search server. Ollama and Qdrant are
# expected to be running on the host already (native or their own compose).
# They are reached through host.docker.internal.
#
#   docker compose up -d --build

services:
  server:
    build: ./server
    ports:
      - "8342:8342"
    volumes:
      # Mount your config file (copy config.example.yaml to config.yaml and edit)
      - ./config.yaml:/app/config.yaml:ro
      # Persist the keyword index / content hashes
      - server_data:/app/data
    environment:
      # Host services (native Ollama + Qdrant)
      - TAIS_QDRANT_URL=http://host.docker.internal:6333
      - TAIS_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TAIS_API_HOST=0.0.0.0
    extra_hosts:
      # Allows the container to reach services running on the host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Optional: run Qdrant here instead of on the host ─────────────────
  # Uncomment and remove TAIS_QDRANT_URL above, then add qdrant to the
  # server's depends_on. If you already run Qdrant natively, leave this off.
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   restart: unless-stopped

volumes:
  server_data:
  # qdrant_data:
